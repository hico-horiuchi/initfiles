# General
show_listening_ports = false
remove_merged_worktrees = true

# Theme
theme = "light:Catppuccin Latte,dark:Catppuccin Mocha"

# Sidebar
layout = "normal-rounded"
agents_placement = "nested"
show_repository_icons = false

# Code
[code]
license_accepted = true
port = 65200

# Fonts
[terminal]
family = "Liga Ricty for Powerline"
size = 15.0

[sidebar]
activity_bar = false
family = "Liga Ricty for Powerline"
size = 15.0

[tabs]
family = "Liga Ricty for Powerline"
size = 15.0

# Notifications
[sound]
volume = 100
